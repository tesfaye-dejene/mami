{% extends "base.html" %}
{% block title %}Login · Inventory Shop{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold text-slate-900 mb-2">Login</h1>
  <p class="text-slate-500 text-sm mb-6">Customers and the shop owner use the same form. Owner accounts open the dashboard.</p>
  <form method="post" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
      <input type="text" name="username" value="{{ username|default:'' }}" required
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" name="password" required
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 outline-none">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700">Sign in</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">No account? <a href="{% url 'shop:register' %}" class="text-brand-600 font-medium">Register</a></p>
  <p class="mt-2 text-center text-xs text-slate-400">Demo owner: admin / Admin12345!</p>
</div>
{% endblock %}
