{% extends "base.html" %}
{% block title %}Register · Inventory Shop{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold text-slate-900 mb-6">Create account</h1>
  <form method="post" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Full name *</label>
      <input type="text" name="full_name" value="{{ form.full_name|default:'' }}" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username *</label>
      <input type="text" name="username" value="{{ form.username|default:'' }}" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" value="{{ form.email|default:'' }}" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
      <input type="text" name="phone" value="{{ form.phone|default:'' }}" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Address</label>
      <textarea name="address" rows="2" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">{{ form.address|default:'' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password * (min 8)</label>
      <input type="password" name="password" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Confirm password *</label>
      <input type="password" name="password2" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700">Register</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">Already have an account? <a href="{% url 'shop:login' %}" class="text-brand-600 font-medium">Login</a></p>
</div>
{% endblock %}
