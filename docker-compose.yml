services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "local-docker-secret-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DB_ENGINE: "sqlite3"
      RUN_SETUP_DEMO: "1"
      PORT: "8000"
    volumes:
      - media_data:/app/media

volumes:
  media_data: